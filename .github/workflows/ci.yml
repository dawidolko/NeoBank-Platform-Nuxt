name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://neobank:neobank@localhost:5432/neobank_test?schema=public
  NUXT_SESSION_SECRET: ci-secret-not-used-in-production

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neobank
          POSTGRES_PASSWORD: neobank
          POSTGRES_DB: neobank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neobank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify seed is idempotent
        run: |
          npm run db:seed
          npm run db:seed

  docker:
    name: Build production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .tools/docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: neobank:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the full stack and check health
        run: |
          docker compose -f .tools/docker/docker-compose.yml up -d --build
          echo "Waiting for the application to become healthy..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "Application is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Application failed to become healthy in time. Logs:"
          docker compose -f .tools/docker/docker-compose.yml logs --tail=100
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f .tools/docker/docker-compose.yml down -v
