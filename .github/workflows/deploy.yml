name: Deploy NeoBank

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-neobank
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Validate compose file
        run: docker compose -f .tools/docker/docker-compose.prod.yml config > /dev/null
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          NUXT_SESSION_SECRET: ci-secret-not-used-at-runtime

  sekrety:
    name: Deployment configuration
    runs-on: ubuntu-latest
    outputs:
      gotowe: ${{ steps.test.outputs.gotowe }}
    steps:
      - id: test
        env:
          IP: ${{ secrets.SERVER_IP }}
          UZYTKOWNIK: ${{ secrets.SERVER_USER }}
          KLUCZ: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Missing secrets are not a build error, they just mean there is nowhere to
          # deploy. The run then finishes green and the `deploy` job is skipped, so a red
          # status means a real code problem rather than an unconfigured repository.
          brak=""
          [ -z "$IP" ]         && brak="$brak SERVER_IP"
          [ -z "$UZYTKOWNIK" ] && brak="$brak SERVER_USER"
          [ -z "$KLUCZ" ]      && brak="$brak SSH_PRIVATE_KEY"

          if [ -n "$brak" ]; then
            echo "gotowe=nie" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::Missing secrets:$brak - add them in Settings > Secrets and variables > Actions."
            echo "Deployment skipped. Missing secrets:$brak"
          else
            echo "gotowe=tak" >> "$GITHUB_OUTPUT"
            echo "Secrets present, deploying."
          fi

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [verify, sekrety]
    if: needs.sekrety.outputs.gotowe == 'tak'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/neobank

            echo "==> Fetching changes..."
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .tools/docker/.env ]; then
              echo "ERROR: missing .tools/docker/.env - copy .env.example and fill it in."
              exit 1
            fi

            echo "==> Rebuilding containers..."
            docker compose -f .tools/docker/docker-compose.prod.yml --env-file .tools/docker/.env up -d --build

            echo "==> Waiting for the application..."
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8120/ || echo "000")
              case "$code" in 200|301|302) break;; esac
              sleep 10
            done

            echo "==> Status:"
            docker compose -f .tools/docker/docker-compose.prod.yml --env-file .tools/docker/.env ps

            echo "==> Verifying the response..."
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8120/ || echo "000")
            echo "HTTP: $code"
            case "$code" in
              200|301|302) echo "==> Deploy zakonczony." ;;
              *)
                echo "The application is not responding correctly."
                docker compose -f .tools/docker/docker-compose.prod.yml --env-file .tools/docker/.env logs --tail=60
                exit 1
                ;;
            esac
